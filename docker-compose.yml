services:
  db:
    image: postgres:16
    container_name: payroll_db
    environment:
      POSTGRES_DB: payroll
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - payroll_db_data:/var/lib/postgresql/data

volumes:
  payroll_db_data:
